table:
  name: orders
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: order_items
    using:
      foreign_key_constraint_on:
        table:
          name: order_items
          schema: public
        column: order_id
  - name: shipping_addresses
    using:
      foreign_key_constraint_on:
        table:
          name: shipping_addresses
          schema: public
        column: order_id
event_triggers:
  - name: order_inserted_start_workflow
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook_from_env: HASURA_ORDER_EVENT_WEBHOOK_URL
    headers:
      - name: x-hasura-event-secret
        value_from_env: HASURA_EVENT_SECRET
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - firebase_uid
        - order_id
        - status
        - payment_method
        - subtotal
        - total
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
