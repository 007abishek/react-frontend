table:
  name: cart_items
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: product
    using:
      foreign_key_constraint_on: product_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - product_id
        - title
        - price
        - thumbnail
        - images
        - quantity
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - product_id
        - title
        - price
        - thumbnail
        - images
        - quantity
update_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - title
        - price
        - thumbnail
        - images
        - quantity
        - updated_at
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
