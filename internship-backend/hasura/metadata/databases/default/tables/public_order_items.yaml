table:
  name: order_items
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
  - name: product
    using:
      foreign_key_constraint_on: product_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - order_id
        - product_id
        - title
        - price
        - thumbnail
        - quantity
        - created_at
      filter:
        order:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
