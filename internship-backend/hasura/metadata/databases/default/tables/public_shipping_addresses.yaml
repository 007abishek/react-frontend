table:
  name: shipping_addresses
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - order_id
        - full_name
        - phone
        - email
        - address_line1
        - address_line2
        - city
        - state
        - pincode
        - created_at
      filter:
        order:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
