

services:

  postgres:
    image: postgres:16-alpine
    container_name: ecom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass
      POSTGRES_DB: ecom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecom_network

  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: ecom_temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=ecom_user
      - POSTGRES_PWD=ecom_pass
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml

    ports:
      - "7233:7233"
    depends_on:
      - postgres
    networks:
      - ecom_network
    volumes:
      - ./temporal-config:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: ecom_temporal_ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS= http://localhost:3000
    ports:
      - "8233:8080" 
    depends_on:
      - temporal
    networks:
      - ecom_network




  api:
    build: .
    container_name: ecom_api
    restart: unless-stopped
    depends_on:
      - postgres
      - temporal
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - POSTGRES_URL=postgres://ecom_user:ecom_pass@postgres:5432/ecom_db
      - TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - ecom_network
    
    command: sh -c "npm run build && npm start"

networks:
  ecom_network:
    driver: bridge
volumes:
  postgres_data: